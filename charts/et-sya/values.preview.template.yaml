nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  devmemoryLimits: 1024Mi
  devmemoryRequests: 512Mi
  environment:
    ET_SYA_API_HOST: http://et-cos-aat.service.core-compute-aat.internal
    HMCTS_ACCESS: 'true'
    REDIS_SECONDARY_HOST: 'et-managed-redis-aat.uksouth.redis.azure.net'
    REDIS_SECONDARY_PORT: '10000'
  keyVaults:
    et:
      resourceGroup: et
      secrets:
        - app-insights-connection-string
        - idam-secret
        - et-redis-access-key
        - et-managed-redis-access-key
        - et-session-secret
        - os-places-token
        - pcq-token-key
        - launch-darkly-sdk-key
        - csrf-token-secret
        - s2s-secret-sya
idam-pr:
  enabled: true
  redirect_uris:
    ET Citizen Submit Your Appeal:
      - https://${SERVICE_FQDN}/oauth2/callback
